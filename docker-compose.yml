version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      PORT: 4000

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - '5173:5173'
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:4000
